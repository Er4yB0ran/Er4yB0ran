<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <style>
    .win { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .bar { fill: #161b22; }
    .title { fill: #8b949e; font: 12px Consolas, 'Courier New', monospace; }
    text { font-family: Consolas, 'Courier New', monospace; font-size: 15px; }
    .prompt { fill: #58a6ff; }
    .cmd { fill: #e6edf3; }
    .out { fill: #9da7b3; }
    .dim { fill: #484f58; }
    .ok { fill: #58a6ff; }
    .final { fill: #79c0ff; font-weight: bold; }
    .cur { fill: #58a6ff; animation: curXY 14s linear forwards, blink 1s steps(1) infinite; }

    .c1a { opacity: 1; animation: o_c1a 14s steps(1) forwards; }
    .c1b { opacity: 0; animation: o_c1b 14s steps(1) forwards; }
    .c1c { opacity: 0; animation: o_c1c 14s steps(1) forwards; }
    .o1 { opacity: 0; animation: o_o1 14s steps(1) forwards; }
    .l2 { opacity: 0; animation: o_l2 14s steps(1) forwards; }
    .pwdp { opacity: 0; animation: o_pwdp 14s steps(1) forwards; }
    .root { opacity: 0; animation: o_root 14s steps(1) forwards; }
    .ok1 { opacity: 0; animation: o_ok1 14s steps(1) forwards; }
    .ok2 { opacity: 0; animation: o_ok2 14s steps(1) forwards; }
    .ok3 { opacity: 0; animation: o_ok3 14s steps(1) forwards; }
    .fin { opacity: 0; animation: o_fin 14s steps(1) forwards; }
    .rl { opacity: 0; animation: o_rl 14s steps(1) forwards; }

    #r_c1a { animation: w_c1a 14s linear forwards; }
    #r_c1c { animation: w_c1c 14s linear forwards; }
    #r_l2 { animation: w_l2 14s linear forwards; }
    #r_pwd { animation: w_pwd 14s linear forwards; }
    #r_root { animation: w_root 14s linear forwards; }

    @keyframes w_c1a {
      0%, 4.28% { width: 0; animation-timing-function: steps(6); }
      12.86%, 100% { width: 54px; }
    }
    @keyframes w_c1c {
      0%, 19.29% { width: 27px; animation-timing-function: steps(3); }
      23.57%, 100% { width: 54px; }
    }
    @keyframes w_l2 {
      0%, 32.14% { width: 0; animation-timing-function: steps(7); }
      40.71%, 100% { width: 63px; }
    }
    @keyframes w_pwd {
      0%, 44.29% { width: 0; animation-timing-function: steps(9); }
      52.86%, 100% { width: 81px; }
    }
    @keyframes w_root {
      0%, 57.14% { width: 0; animation-timing-function: steps(19); }
      67.86%, 100% { width: 172px; }
    }

    @keyframes o_c1a { 0% { opacity: 1; } 16.43%, 100% { opacity: 0; } }
    @keyframes o_c1b { 0%, 16.42% { opacity: 0; } 16.43% { opacity: 1; } 19.29%, 100% { opacity: 0; } }
    @keyframes o_c1c { 0%, 19.28% { opacity: 0; } 19.29%, 100% { opacity: 1; } }
    @keyframes o_o1 { 0%, 24.99% { opacity: 0; } 25%, 100% { opacity: 1; } }
    @keyframes o_l2 { 0%, 32.13% { opacity: 0; } 32.14%, 100% { opacity: 1; } }
    @keyframes o_pwdp { 0%, 42.13% { opacity: 0; } 42.14%, 100% { opacity: 1; } }
    @keyframes o_root { 0%, 54.99% { opacity: 0; } 55%, 100% { opacity: 1; } }
    @keyframes o_ok1 { 0%, 69.99% { opacity: 0; } 70%, 100% { opacity: 1; } }
    @keyframes o_ok2 { 0%, 73.56% { opacity: 0; } 73.57%, 100% { opacity: 1; } }
    @keyframes o_ok3 { 0%, 77.13% { opacity: 0; } 77.14%, 100% { opacity: 1; } }
    @keyframes o_fin { 0%, 80.7% { opacity: 0; } 80.71%, 100% { opacity: 1; } }
    @keyframes o_rl { 0%, 84.99% { opacity: 0; } 85%, 100% { opacity: 1; } }
    @keyframes curXY {
      0% { x: 136px; y: 52px; visibility: visible; }
      4.28% { x: 136px; y: 52px; animation-timing-function: steps(6); }
      12.86% { x: 190px; y: 52px; animation-timing-function: steps(1); }
      16.43% { x: 163px; y: 52px; }
      19.29% { x: 163px; y: 52px; animation-timing-function: steps(3); }
      23.57% { x: 190px; y: 52px; animation-timing-function: steps(1); }
      25% { x: 190px; y: 52px; visibility: hidden; }
      32.14% { x: 136px; y: 126px; visibility: visible; animation-timing-function: steps(7); }
      40.71% { x: 199px; y: 126px; animation-timing-function: steps(1); }
      42.14% { x: 199px; y: 126px; visibility: hidden; }
      44.29% { x: 263px; y: 152px; visibility: visible; animation-timing-function: steps(9); }
      52.86% { x: 344px; y: 152px; animation-timing-function: steps(1); }
      54% { x: 344px; y: 152px; visibility: hidden; }
      55% { x: 136px; y: 182px; visibility: visible; }
      57.14% { x: 136px; y: 182px; animation-timing-function: steps(19); }
      67.86% { x: 308px; y: 182px; animation-timing-function: steps(1); }
      68.5% { x: 308px; y: 182px; visibility: hidden; }
      85% { x: 136px; y: 305px; visibility: visible; }
      100% { x: 136px; y: 305px; }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <!-- terminal window -->
  <rect class="win" x="4" y="4" width="752" height="322" rx="10"/>
  <rect class="bar" x="4" y="4" width="752" height="30" rx="10"/>
  <rect x="4" y="20" width="752" height="14" fill="#161b22"/>
  <circle cx="26" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="19" r="6" fill="#febc2e"/>
  <circle cx="66" cy="19" r="6" fill="#28c840"/>
  <text class="title" x="330" y="23">eray@dev — bash</text>

  <!-- line 1: whoami with typo -->
  <text class="prompt" x="28" y="66">eray@dev:~$ </text>
  <clipPath id="cp_c1a"><rect id="r_c1a" x="136" y="52" width="0" height="20"/></clipPath>
  <text class="cmd c1a" x="136" y="66" clip-path="url(#cp_c1a)">whoqmi</text>
  <text class="cmd c1b" x="136" y="66">who</text>
  <clipPath id="cp_c1c"><rect id="r_c1c" x="136" y="52" width="27" height="20"/></clipPath>
  <text class="cmd c1c" x="136" y="66" clip-path="url(#cp_c1c)">whoami</text>

  <!-- whoami output -->
  <text class="out o1" x="28" y="90">eray — full-stack developer · security-first mindset</text>
  <text class="out o1" x="28" y="110">building software since 2018 · calm, data-driven</text>

  <!-- line 2: sudo -->
  <text class="prompt l2" x="28" y="140">eray@dev:~$ </text>
  <clipPath id="cp_l2"><rect id="r_l2" x="136" y="126" width="0" height="20"/></clipPath>
  <text class="cmd l2" x="136" y="140" clip-path="url(#cp_l2)">sudo -i</text>

  <!-- password -->
  <text class="out pwdp" x="28" y="166">[sudo] password for eray: </text>
  <clipPath id="cp_pwd"><rect id="r_pwd" x="263" y="152" width="0" height="20"/></clipPath>
  <text class="dim pwdp" x="263" y="166" clip-path="url(#cp_pwd)">Er4yB0ran</text>

  <!-- root: init script -->
  <text class="prompt root" x="28" y="196">root@dev:~# </text>
  <clipPath id="cp_root"><rect id="r_root" x="136" y="182" width="0" height="20"/></clipPath>
  <text class="cmd root" x="136" y="196" clip-path="url(#cp_root)">./init_dashboard.sh</text>

  <!-- script output -->
  <text class="ok ok1" x="28" y="224">[ OK ] fetching github analytics</text>
  <text class="ok ok2" x="28" y="246">[ OK ] compiling stats widgets</text>
  <text class="ok ok3" x="28" y="268">[ OK ] dashboard ready</text>
  <text class="final fin" x="28" y="296">▸ access granted — scroll down</text>

  <!-- final idle root prompt -->
  <text class="prompt rl" x="28" y="318">root@dev:~# </text>
  <rect class="cur" x="136" y="305" width="9" height="17"/>
</svg>
