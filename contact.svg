<svg xmlns="http://www.w3.org/2000/svg" width="560" height="156" viewBox="0 0 560 156">
  <style>
    .win { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    text { font-family: Consolas, 'Courier New', monospace; font-size: 15px; }
    .title { fill: #8b949e; font-size: 12px; }
    .prompt { fill: #58a6ff; }
    .cmd { fill: #e6edf3; }
    .out { fill: #9da7b3; }
    .val { fill: #e6edf3; }
    .o1 { opacity: 0; animation: s1 8s steps(1) forwards; }
    .o2 { opacity: 0; animation: s2 8s steps(1) forwards; }
    .rl { opacity: 0; animation: s3 8s steps(1) forwards; }
    #rc { animation: wcmd 8s linear forwards; }
    .cur { fill: #58a6ff; animation: curXY 8s linear forwards, blink 1s steps(1) infinite; }

    @keyframes wcmd {
      0%, 5% { width: 0; animation-timing-function: steps(15); }
      42.5%, 100% { width: 135px; }
    }
    @keyframes curXY {
      0% { x: 132px; y: 42px; visibility: visible; }
      5% { x: 132px; y: 42px; animation-timing-function: steps(15); }
      42.5% { x: 267px; y: 42px; animation-timing-function: steps(1); }
      44% { x: 267px; y: 42px; visibility: hidden; }
      72% { x: 132px; y: 124px; visibility: visible; }
      100% { x: 132px; y: 124px; }
    }
    @keyframes s1 { 0%, 51.9% { opacity: 0; } 52%, 100% { opacity: 1; } }
    @keyframes s2 { 0%, 61.9% { opacity: 0; } 62%, 100% { opacity: 1; } }
    @keyframes s3 { 0%, 71.9% { opacity: 0; } 72%, 100% { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <rect class="win" x="4" y="4" width="552" height="148" rx="10"/>
  <rect class="bar" x="4" y="4" width="552" height="26" rx="10" fill="#161b22"/>
  <rect x="4" y="18" width="552" height="12" fill="#161b22"/>
  <circle cx="24" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="17" r="5" fill="#febc2e"/>
  <circle cx="60" cy="17" r="5" fill="#28c840"/>
  <text class="title" x="248" y="21">root@dev — bash</text>

  <text class="prompt" x="24" y="56">root@dev:~# </text>
  <clipPath id="cpc"><rect id="rc" x="132" y="42" width="0" height="20"/></clipPath>
  <text class="cmd" x="132" y="56" clip-path="url(#cpc)">cat contact.txt</text>

  <g class="o1">
    <g transform="translate(24,73) scale(0.62)" stroke="#58a6ff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="20" height="16" x="2" y="4" rx="2"/>
      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
    </g>
    <text class="val" x="50" y="86">erayboranagirdici@gmail.com</text>
  </g>

  <g class="o2">
    <g transform="translate(24,99) scale(0.62)" stroke="#58a6ff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4V8h4"/>
      <rect width="4" height="12" x="2" y="9"/>
      <circle cx="4" cy="4" r="2"/>
    </g>
    <text class="val" x="50" y="112">linkedin.com/in/eray-ağırdıcı</text>
  </g>

  <text class="prompt rl" x="24" y="138">root@dev:~# </text>
  <rect class="cur" x="132" y="42" width="9" height="17"/>
</svg>
